<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Govt of Tamil Nadu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .gov-header { border-bottom: 3px solid #dc3545; }
    </style>
</head>
<body class="bg-light">

<!-- Admin Login Modal -->
<div class="modal fade" id="adminLoginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock-fill me-2"></i>Admin Login</h5>
            </div>
            <div class="modal-body p-4">
                <form onsubmit="handleAdminLogin(event)">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Select District (மாவட்டம்) <span class="text-danger">*</span></label>
                        <select id="adminDistrictSelect" class="form-select" required>
                            <option value="">-- Select District --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" id="adminUser" class="form-control" placeholder="e.g. admin_erode, admin_salem" required>
                        <small class="text-muted">Standard Format: admin_&lt;districtname&gt;</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" id="adminPass" class="form-control" placeholder="e.g. erode123, salem123" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('adminPass', 'eyeIconAdmin')">
                                <i class="bi bi-eye-slash" id="eyeIconAdmin"></i>
                            </button>
                        </div>
                    </div>
                    <div id="loginErr" class="text-danger mb-3 small" style="display:none;">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>Invalid Credentials! (Try username: admin_erode / pass: erode123)
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold">Login to Admin Portal</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="container py-4" id="adminMainContent" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 gov-header">
        <div>
            <span class="badge bg-danger mb-1"><i class="bi bi-exclamation-circle-fill me-1"></i>Overdue Complaints Queue</span>
            <h3 class="fw-bold text-dark mb-0" id="adminTitle">Admin Control Center</h3>
        </div>
        <a href="/citizen.html" class="btn btn-outline-dark btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Citizen Portal</a>
    </div>

    <!-- Filter Bar for Constituencies -->
    <div class="row my-3 align-items-center">
        <div class="col-md-5">
            <label class="form-label fw-semibold mb-1"><i class="bi bi-funnel-fill me-1"></i>Filter by Constituency:</label>
            <select id="constituencyFilter" class="form-select border-danger" onchange="filterByConstituency()">
                <option value="ALL">-- All Constituencies in District --</option>
            </select>
        </div>
    </div>

    <div class="table-responsive shadow-sm rounded border">
        <table class="table table-hover bg-white mb-0 align-middle">
            <thead class="table-danger text-nowrap">
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 25%;">Constituency & Village</th>
                    <th style="width: 15%;">Incident Category</th>
                    <th style="width: 25%;">Location / GPS</th>
                    <th style="width: 15%;">Status</th>
                    <th style="width: 10%; text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody id="adminBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Tamil Nadu: Complete 38 Districts and 234 Assembly Constituencies
const tnData = {
    "Ariyalur": ["Ariyalur", "Jayankondam"],
    "Chengalpattu": ["Chengalpattu", "Thiruporur", "Cheyyur", "Madurantakam", "Tambaram", "Pallavaram", "Shohinganallur"],
    "Chennai": ["Gummidipoondi", "Ponneri", "Tiruvottiyur", "Dr. Radhakrishnan Nagar", "Perambur", "Kolathur", "Villivakkam", "Thiru-Vi-Ka-Nagar", "Egmore", "Royapuram", "Harbour", "Chepauk-Thiruvallikeni", "Thousand Lights", "Anna Nagar", "Virugampakkam", "Saidapet", "Thiyagarayanagar", "Mylapore", "Velachery"],
    "Coimbatore": ["Mettupalayam", "Avanashi", "Tiruppur North", "Tiruppur South", "Sulur", "Kavundampalayam", "Coimbatore North", "Thondamuthur", "Coimbatore South", "Singanallur", "Kinathukadavu", "Pollachi", "Valparai"],
    "Cuddalore": ["Tittakudi", "Vriddhachalam", "Neyveli", "Cuddalore", "Kurinjipadi", "Buvanagiri", "Chidambaram", "Kattumannarkoil"],
    "Dharmapuri": ["Palacode", "Pennagaram", "Dharmapuri", "Pappireddipatti", "Harur"],
    "Dindigul": ["Palani", "Oddanchatram", "Athoor", "Nilakottai", "Natham", "Dindigul", "Vedasandur"],
    "Erode": ["Erode East", "Erode West", "Modakkurichi", "Perundurai", "Bhavani", "Anthiyur", "Gobichettipalayam", "Bhavanisagar"],
    "Kallakurichi": ["Ulundurpet", "Rishivandiyam", "Sankarapuram", "Kallakurichi"],
    "Kanchipuram": ["Kanchipuram", "Sriperumbudur", "Uthiramerur"],
    "Kanyakumari": ["Kanniyakumari", "Nagercoil", "Colachel", "Padmanabhapuram", "Vilavancode", "Killiyoor"],
    "Karur": ["Aravakurichi", "Karur", "Krishnarayapuram", "Kulithalai"],
    "Krishnagiri": ["Uthangarai", "Bargur", "Krishnagiri", "Veppanahalli", "Hosur", "Thalli"],
    "Madurai": ["Melur", "Madurai East", "Sholavandan", "Madurai North", "Madurai South", "Madurai Central", "Madurai West", "Tiruparankundram", "Tirumangalam", "Usilampatti"],
    "Mayiladuthurai": ["Sirkali", "Mayiladuthurai", "Poompuhar"],
    "Nagapattinam": ["Nagapattinam", "Kilvelur", "Vedaranyam"],
    "Namakkal": ["Rasipuram", "Senthamangalam", "Namakkal", "Paramathi-Velur", "Tiruchengodu", "Kumarapalayam"],
    "Nilgiris": ["Udhagamandalam", "Gudalur", "Coonoor"],
    "Perambalur": ["Perambalur", "Kunnam"],
    "Pudukkottai": ["Gandharvakottai", "Viralimalai", "Pudukkottai", "Thirumayam", "Alangudi", "Aranthangi"],
    "Ramanathapuram": ["Paramakudi", "Tiruvadanai", "Ramanathapuram", "Mudukulathur"],
    "Ranipet": ["Sholinghur", "Ranipet", "Arcot"],
    "Salem": ["Mettur", "Omalur", "Edappadi", "Sankari", "Salem West", "Salem North", "Salem South", "Veerapandi", "Yercaud", "Athanavoor", "Attur", "Gangavalli"],
    "Sivaganga": ["Karaikudi", "Tiruppattur", "Sivaganga", "Manamadurai"],
    "Tenkasi": ["Rajapalayam", "Srivilliputhur", "Tenkasi", "Alangulam", "Kadayanallur", "Vasudevanallur"],
    "Thanjavur": ["Thiruvaiyaru", "Thanjavur", "Orathanadu", "Pattukkottai", "Peravurani", "Tiruvidaimarudur", "Kumbakonam", "Papanasam"],
    "Theni": ["Andipatti", "Periyakulam", "Bodinayakanur", "Cumbum"],
    "Thoothukudi": ["Vilaathikulam", "Tiruchendur", "Srivaikuntam", "Ottapidaram", "Kovilpatti", "Thoothukkudi"],
    "Tiruchirappalli": ["Manapparai", "Srirangam", "Tiruchirappalli West", "Tiruchirappalli East", "Tiruverumbur", "Lalgudi", "Manachanallur", "Musiri", "Thuraiyur"],
    "Tirunelveli": ["Tirunelveli", "Ambasamudram", "Palayamkottai", "Nanguneri", "Radhapuram"],
    "Tirupathur": ["Jolarpet", "Tirupathur", "Vaniyambadi", "Ambur"],
    "Tiruppur": ["Dharapuram", "Kangayam", "Udumalaipettai", "Madathukulam"],
    "Tiruvallur": ["Gudiyattam", "Tiruvallur", "Poonamallee", "Avadi", "Tiruttani"],
    "Tiruvannamalai": ["Chengam", "Tiruvannamalai", "Kilpennathur", "Polur", "Arani", "Cheyyar", "Vandavasi"],
    "Tiruvarur": ["Thiruthuraipoondi", "Mannargudi", "Tiruvarur", "Nannilam"],
    "Vellore": ["Katpadi", "Vellore", "Anaikattu", "Kilvaithinankuppam"],
    "Viluppuram": ["Gingee", "Tindivanam", "Mailam", "Vikravandi", "Villupuram", "Tirukkoyilur"],
    "Virudhunagar": ["Satur", "Sivakasi", "Virudhunagar", "Aruppukottai", "Tiruchuli"]
};

let adminModal, currentDistrict = "", allEscalatedComplaints = [];

window.onload = function() {
    const distSelect = document.getElementById('adminDistrictSelect');
    for (let district in tnData) {
        distSelect.innerHTML += `<option value="${district}">${district}</option>`;
    }
    adminModal = new bootstrap.Modal(document.getElementById('adminLoginModal'));
    adminModal.show();
};

function togglePassword(inputId, iconId) {
    const pwdInput = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (pwdInput.type === "password") {
        pwdInput.type = "text";
        icon.classList.replace("bi-eye-slash", "bi-eye");
    } else {
        pwdInput.type = "password";
        icon.classList.replace("bi-eye", "bi-eye-slash");
    }
}

function handleAdminLogin(e) {
    e.preventDefault();
    const selectedDist = document.getElementById('adminDistrictSelect').value;
    const user = document.getElementById('adminUser').value.trim().toLowerCase();
    const pass = document.getElementById('adminPass').value.trim();

    if (user.startsWith("admin_")) {
        const districtName = user.replace("admin_", "");
        if (pass === districtName + "123" || pass === "admin123") {
            currentDistrict = selectedDist || (districtName.charAt(0).toUpperCase() + districtName.slice(1));
            document.getElementById('adminTitle').innerText = `${currentDistrict} Admin Control Center`;
            
            populateConstituencyFilter(currentDistrict);
            adminModal.hide();
            document.getElementById('adminMainContent').style.display = 'block';
            loadEscalations();
            return;
        }
    }
    document.getElementById('loginErr').style.display = 'block';
}

function populateConstituencyFilter(district) {
    const filterSelect = document.getElementById('constituencyFilter');
    filterSelect.innerHTML = '<option value="ALL">-- All Constituencies in ' + district + ' --</option>';
    if (tnData[district]) {
        tnData[district].forEach(c => {
            filterSelect.innerHTML += `<option value="${c}">${c} Constituency</option>`;
        });
    }
}

async function loadEscalations() {
    try {
        const res = await fetch(`/api/admin/${currentDistrict}/escalations`);
        allEscalatedComplaints = await res.json();
        renderTable(allEscalatedComplaints);
    } catch (err) {
        console.error("Error loading escalations:", err);
    }
}

function filterByConstituency() {
    const selectedConst = document.getElementById('constituencyFilter').value;
    if (selectedConst === 'ALL') {
        renderTable(allEscalatedComplaints);
    } else {
        const filtered = allEscalatedComplaints.filter(c => c.constituency === selectedConst);
        renderTable(filtered);
    }
}

function renderTable(complaints) {
    const tbody = document.getElementById('adminBody');
    tbody.innerHTML = '';

    if (complaints.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted"><i class="bi bi-check-circle text-success me-1"></i>No escalated incidents found for the selected constituency.</td></tr>`;
        return;
    }

    complaints.forEach(c => {
        const mapBtn = (c.latitude && c.longitude) ? 
            `<br><a href="https://www.google.com/maps?q=${c.latitude},${c.longitude}" target="_blank" class="btn btn-xs btn-outline-danger mt-1" style="font-size:0.75rem;"><i class="bi bi-geo-alt-fill"></i> View Map</a>` : '';

        tbody.innerHTML += `
            <tr>
                <td><span class="fw-bold text-danger">${c.complaintId}</span></td>
                <td>
                    <span class="badge bg-danger mb-1">${c.constituency || 'General'}</span><br>
                    <small class="fw-semibold text-dark">${c.village || '-'}</small>
                </td>
                <td><span class="badge bg-secondary">${c.category}</span></td>
                <td class="small">${c.location || ''} ${mapBtn}</td>
                <td><span class="badge bg-danger">${c.status}</span></td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-danger py-1 px-2" onclick="deleteComplaint('${c.complaintId}')" title="Delete Record">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
    });
}

async function deleteComplaint(id) {
    if (confirm(`Are you sure you want to delete incident record ${id}?`)) {
        try {
            const res = await fetch(`/api/complaints/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadEscalations();
            } else {
                alert("Failed to delete record.");
            }
        } catch (err) {
            console.error(err);
        }
    }
}
</script>
</body>
</html>
