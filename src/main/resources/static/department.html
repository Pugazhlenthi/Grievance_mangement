<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constituency Officer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .gov-header { border-bottom: 3px solid #0d6efd; }
    </style>
</head>
<body class="bg-light">

<!-- Constituency Officer Login Modal -->
<div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock-fill me-2"></i>Constituency Officer Portal Login</h5>
            </div>
            <div class="modal-body p-4">
                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Select District <span class="text-danger">*</span></label>
                        <select id="loginDistrict" class="form-select" onchange="loadLoginConstituencies()" required>
                            <option value="">-- Select District --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Select Constituency <span class="text-danger">*</span></label>
                        <select id="loginConstituency" class="form-select" required>
                            <option value="">-- Select Constituency --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" id="constUsername" class="form-control" placeholder="e.g. anthiyur, perundurai" required>
                        <small class="text-muted">Format: constituency name in lowercase</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" id="constPassword" class="form-control" placeholder="e.g. anthiyur123" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('constPassword', 'eyeIconDept')">
                                <i class="bi bi-eye-slash" id="eyeIconDept"></i>
                            </button>
                        </div>
                    </div>
                    <div id="loginErr" class="text-danger mb-3 small" style="display:none;"><i class="bi bi-exclamation-triangle-fill me-1"></i>Invalid Credentials! (e.g. username: anthiyur, pass: anthiyur123)</div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Login to Portal</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Image Preview Modal -->
<div class="modal fade" id="imagePreviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fs-6"><i class="bi bi-image me-2"></i>Evidence Photo Inspection</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center p-3 bg-secondary bg-opacity-10">
                <img id="previewImageSrc" src="" class="img-fluid rounded border shadow-sm" alt="Evidence Photo" style="max-height: 70vh;">
            </div>
        </div>
    </div>
</div>

<div class="container py-4" id="mainContent" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 gov-header">
        <div>
            <span class="badge bg-primary mb-1">Government of Tamil Nadu</span>
            <h3 class="fw-bold text-dark mb-0" id="dashboardTitle">Constituency Dashboard</h3>
        </div>
        <a href="/citizen.html" class="btn btn-outline-dark btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Citizen Portal</a>
    </div>

    <!-- Category Filter Buttons -->
    <div class="row my-3 align-items-center">
        <div class="col-md-8">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary active" onclick="filterCategory('ALL', this)">All Complaints</button>
                <button type="button" class="btn btn-outline-primary" onclick="filterCategory('WATER_SUPPLY', this)">💧 Water Supply</button>
                <button type="button" class="btn btn-outline-primary" onclick="filterCategory('ROADS', this)">🛣️ Roads</button>
                <button type="button" class="btn btn-outline-primary" onclick="filterCategory('ELECTRICITY', this)">⚡ Electricity</button>
            </div>
        </div>
    </div>

    <div class="table-responsive shadow-sm rounded border">
        <table class="table table-hover bg-white mb-0 align-middle">
            <thead class="table-dark text-nowrap">
                <tr>
                    <th style="width: 8%;">ID</th>
                    <th style="width: 22%;">Location / GPS</th>
                    <th style="width: 25%;">Description</th>
                    <th style="width: 12%;">Evidence</th>
                    <th style="width: 8%;">Severity</th>
                    <th style="width: 7%;">Count</th>
                    <th style="width: 8%;">Status</th>
                    <th style="width: 10%; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="queueBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// All 38 Districts and 234 Constituencies of Tamil Nadu
const tnData = {
    "Ariyalur": ["Ariyalur", "Jayankondam"],
    "Chengalpattu": ["Chengalpattu", "Thiruporur", "Cheyyur", "Madurantakam", "Tambaram", "Pallavaram", "Shohinganallur"],
    "Chennai": ["Gummidipoondi", "Ponneri", "Tiruvottiyur", "Dr. Radhakrishnan Nagar", "Perambur", "Kolathur", "Villivakkam", "Thiru-Vi-Ka-Nagar", "Egmore", "Royapuram", "Harbour", "Chepauk-Thiruvallikeni", "Thousand Lights", "Anna Nagar", "Virugampakkam", "Saidapet", "Thiyagarayanagar", "Mylapore", "Velachery"],
    "Coimbatore": ["Mettupalayam", "Avanashi", "Tiruppur North", "Tiruppur South", "Sulur", "Kavundampalayam", "Coimbatore North", "Thondamuthur", "Coimbatore South", "Singanallur", "Kinathukadavu", "Pollachi", "Valparai"],
    "Cuddalore": ["Tittakudi", "Vriddhachalam", "Neyveli", "Cuddalore", "Kurinjipadi", "Buvanagiri", "Chidambaram", "Kattumannarkoil"],
    "Dharmapuri": ["Palacode", "Pennagaram", "Dharmapuri", "Pappireddipatti", "Harur"],
    "Dindigul": ["Palani", "Oddanchatram", "Athoor", "Nilakottai", "Natham", "Dindigul", "Vedasandur"],
    "Erode": ["Erode East", "Erode West", "Modakkurichi", "Perundurai", "Bhavani", "Anthiyur", "Gobichettipalayam", "Bhavanisagar"],
    "Kanchipuram": ["Kanchipuram", "Sriperumbudur", "Uthiramerur"],
    "Kanyakumari": ["Kanniyakumari", "Nagercoil", "Colachel", "Padmanabhapuram", "Vilavancode", "Killiyoor"],
    "Karur": ["Aravakurichi", "Karur", "Krishnarayapuram", "Kulithalai"],
    "Krishnagiri": ["Uthangarai", "Bargur", "Krishnagiri", "Veppanahalli", "Hosur", "Thalli"],
    "Madurai": ["Melur", "Madurai East", "Sholavandan", "Madurai North", "Madurai South", "Madurai Central", "Madurai West", "Tiruparankundram", "Tirumangalam", "Usilampatti"],
    "Mayiladuthurai": ["Sirkali", "Mayiladuthurai", "Poompuhar"],
    "Nagapattinam": ["Nagapattinam", "Kilvelur", "Vedaranyam"],
    "Namakkal": ["Rasipuram", "Senthamangalam", "Namakkal", "Paramathi-Velur", "Tiruchengodu", "Kumarapalayam"],
    "Nilgiris": ["Udhagamandalam", "Gudalur", "Coonoor"],
    "Perambalur": ["Perambalur", "Kunnam"],
    "Pudukkottai": ["Gandharvakottai", "Viralimalai", "Pudukkottai", "Thirumayam", "Alangudi", "Aranthangi"],
    "Ramanathapuram": ["Paramakudi", "Tiruvadanai", "Ramanathapuram", "Mudukulathur"],
    "Ranipet": ["Sholinghur", "Ranipet", "Arcot"],
    "Salem": ["Mettur", "Omalur", "Edappadi", "Sankari", "Salem West", "Salem North", "Salem South", "Veerapandi", "Yercaud", "Athanavoor", "Attur", "Gangavalli"],
    "Sivaganga": ["Karaikudi", "Tiruppattur", "Sivaganga", "Manamadurai"],
    "Tenkasi": ["Rajapalayam", "Srivilliputhur", "Tenkasi", "Alangulam", "Kadayanallur", "Vasudevanallur"],
    "Thanjavur": ["Thiruvaiyaru", "Thanjavur", "Orathanadu", "Pattukkottai", "Peravurani", "Tiruvidaimarudur", "Kumbakonam", "Papanasam"],
    "Theni": ["Andipatti", "Periyakulam", "Bodinayakanur", "Cumbum"],
    "Thoothukudi": ["Vilaathikulam", "Tiruchendur", "Srivaikuntam", "Ottapidaram", "Kovilpatti", "Thoothukkudi"],
    "Tiruchirappalli": ["Manapparai", "Srirangam", "Tiruchirappalli West", "Tiruchirappalli East", "Tiruverumbur", "Lalgudi", "Manachanallur", "Musiri", "Thuraiyur"],
    "Tirunelveli": ["Tirunelveli", "Ambasamudram", "Palayamkottai", "Nanguneri", "Radhapuram"],
    "Tirupathur": ["Jolarpet", "Tirupathur", "Vaniyambadi", "Ambur"],
    "Tiruppur": ["Dharapuram", "Kangayam", "Udumalaipettai", "Madathukulam"],
    "Tiruvallur": ["Gudiyattam", "Tiruvallur", "Poonamallee", "Avadi", "Tiruttani"],
    "Tiruvannamalai": ["Chengam", "Tiruvannamalai", "Kilpennathur", "Polur", "Arani", "Cheyyar", "Vandavasi"],
    "Tiruvarur": ["Thiruthuraipoondi", "Mannargudi", "Tiruvarur", "Nannilam"],
    "Vellore": ["Katpadi", "Vellore", "Anaikattu", "Kilvaithinankuppam"],
    "Viluppuram": ["Gingee", "Tindivanam", "Mailam", "Vikravandi", "Villupuram", "Tirukkoyilur"],
    "Virudhunagar": ["Satur", "Sivakasi", "Virudhunagar", "Aruppukottai", "Tiruchuli"]
};

let loginModal, activeConstituency = "", activeCategory = "ALL";

window.onload = function() {
    const distSelect = document.getElementById('loginDistrict');
    for (let district in tnData) {
        distSelect.innerHTML += `<option value="${district}">${district}</option>`;
    }
    loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
    loginModal.show();
};

function togglePassword(inputId, iconId) {
    const pwdInput = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (pwdInput.type === "password") {
        pwdInput.type = "text";
        icon.classList.replace("bi-eye-slash", "bi-eye");
    } else {
        pwdInput.type = "password";
        icon.classList.replace("bi-eye", "bi-eye-slash");
    }
}

function openImageModal(photoName) {
    document.getElementById('previewImageSrc').src = '/uploads/' + photoName;
    const imgModal = new bootstrap.Modal(document.getElementById('imagePreviewModal'));
    imgModal.show();
}

function loadLoginConstituencies() {
    const district = document.getElementById('loginDistrict').value;
    const constSelect = document.getElementById('loginConstituency');
    constSelect.innerHTML = '<option value="">-- Select Constituency --</option>';

    if (district && tnData[district]) {
        tnData[district].forEach(c => {
            constSelect.innerHTML += `<option value="${c}">${c}</option>`;
        });
    }
}

function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('constUsername').value.trim().toLowerCase();
    const pass = document.getElementById('constPassword').value.trim();
    const selectedConst = document.getElementById('loginConstituency').value;

    if (pass === user + "123" || pass === "const123") {
        activeConstituency = selectedConst || (user.charAt(0).toUpperCase() + user.slice(1));
        document.getElementById('dashboardTitle').innerText = `${activeConstituency} Constituency Queue`;
        loginModal.hide();
        document.getElementById('mainContent').style.display = 'block';
        loadQueue();
    } else {
        document.getElementById('loginErr').style.display = 'block';
    }
}

function filterCategory(category, btn) {
    activeCategory = category;
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadQueue();
}

async function loadQueue() {
    try {
        const res = await fetch(`/api/department/${activeConstituency}/${activeCategory}`);
        const complaints = await res.json();
        const tbody = document.getElementById('queueBody');
        tbody.innerHTML = '';

        if (complaints.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No complaints registered in this constituency.</td></tr>`;
            return;
        }

        complaints.forEach(c => {
            const mapBtn = (c.latitude && c.longitude) ? 
                `<br><a href="https://www.google.com/maps?q=${c.latitude},${c.longitude}" target="_blank" class="btn btn-xs btn-outline-danger mt-1"><i class="bi bi-geo-alt-fill"></i> View Map</a>` : '';

            let cleanPhotoName = c.photoPath ? c.photoPath.split('/').pop().split('\\').pop() : '';

            const photoBtn = (cleanPhotoName && cleanPhotoName !== 'default.jpg') ?
                `<button class="btn btn-sm btn-outline-primary py-0" onclick="openImageModal('${cleanPhotoName}')"><i class="bi bi-card-image me-1"></i>View</button>` : '<span class="text-muted small">No File</span>';

            const statusBadge = c.status === 'RESOLVED' ? 'bg-success' : (c.status === 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-primary');

            tbody.innerHTML += `
                <tr>
                    <td><span class="fw-bold text-secondary">${c.complaintId}</span></td>
                    <td class="small">${c.location} ${mapBtn}</td>
                    <td class="small">${c.description}</td>
                    <td>${photoBtn}</td>
                    <td><span class="badge bg-danger rounded-pill">${c.severityScore} / 5</span></td>
                    <td><span class="badge bg-light text-dark border">${c.reportCount}</span></td>
                    <td><span class="badge ${statusBadge}">${c.status}</span></td>
                    <td class="text-center">
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle py-1 px-2" type="button" data-bs-toggle="dropdown">
                                Action
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                <li><a class="dropdown-item text-success" href="#" onclick="updateStatus('${c.complaintId}', 'RESOLVED')"><i class="bi bi-check-circle me-2"></i>Resolve</a></li>
                                <li><a class="dropdown-item text-warning" href="#" onclick="updateStatus('${c.complaintId}', 'IN_PROGRESS')"><i class="bi bi-clock-history me-2"></i>In Progress</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" onclick="deleteComplaint('${c.complaintId}')"><i class="bi bi-trash me-2"></i>Delete</a></li>
                            </ul>
                        </div>
                    </td>
                </tr>`;
        });
    } catch (err) {
        console.error(err);
    }
}

async function updateStatus(id, status) {
    await fetch(`/api/complaints/${id}/status`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ status })
    });
    loadQueue();
}

async function deleteComplaint(id) {
    if (confirm(`Are you sure you want to delete complaint ${id}?`)) {
        await fetch(`/api/complaints/${id}`, { method: 'DELETE' });
        loadQueue();
    }
}
</script>
</body>
</html>
